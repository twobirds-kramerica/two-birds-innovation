<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digital Confidence Centre beta &middot; Two Birds Innovation</title>
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://twobirds-kramerica.github.io/digital-confidence/">
<!--
  THE BUSINESS CARD QR POINTS HERE. Do not delete this path, and do not
  rename it. Printed cards in circulation encode exactly
  https://twobirdsinnovation.ca/card and cannot be changed after printing.

  To send scanners somewhere else later, change TARGET below and nothing
  else. That is the entire point of pointing the QR at /card rather than at
  a product URL.

  WHEN THE DIGITAL CONFIDENCE CENTRE LEAVES BETA: do not point this straight
  at the production site. The card printed beside this code reads "Want to
  beta test a product?", so a visitor arriving at a finished product has
  been told something untrue. Replace this with a small landing page listing
  the current betas, with DCC marked as shipped. Recorded in the memory bank
  as card-qr-landing-page-plan.
-->
<meta http-equiv="refresh" content="0; url=https://twobirds-kramerica.github.io/digital-confidence/?beta=1">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;
       background:#0066CC;color:#fff;
       font:16px/1.6 Inter,-apple-system,"Segoe UI",Arial,sans-serif;
       text-align:center;padding:24px}
  .w{max-width:34rem}
  h1{font-size:1.35rem;margin:0 0 .5rem}
  p{margin:0 0 1.25rem;opacity:.92}
  a{display:inline-block;background:#fff;color:#0066CC;font-weight:700;
    text-decoration:none;padding:.85rem 1.5rem;border-radius:6px}
  a:focus{outline:3px solid #fff;outline-offset:3px}
</style>
</head>
<body>
  <main class="w">
    <h1>Taking you to the Digital Confidence Centre</h1>
    <p>Free, friendly digital learning for adults. No account needed, nothing to pay.</p>
    <p><a href="https://twobirds-kramerica.github.io/digital-confidence/?beta=1">Continue to the beta</a></p>
  </main>
  <script>
    // Belt and braces: meta refresh covers no-JS, this covers browsers that
    // ignore it. The visible link covers anything that does neither.
    location.replace("https://twobirds-kramerica.github.io/digital-confidence/?beta=1");
  </script>
</body>
</html>
